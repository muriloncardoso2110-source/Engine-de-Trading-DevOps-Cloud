services:
  exchange:
    build: .
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [exchange]
  grafana:
    image: grafana/grafana-oss:11.3.1
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me-locally}
    volumes: ["./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"]
    depends_on: [prometheus]
