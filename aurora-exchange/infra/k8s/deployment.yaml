apiVersion: v1
kind: Namespace
metadata:
  name: aurora
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-exchange
  namespace: aurora
spec:
  replicas: 1 # stateful single-writer demo: never scale replicas without sharding/persistence
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: aurora-exchange}
  template:
    metadata:
      labels: {app: aurora-exchange}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: exchange
          image: aurora-exchange:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: '250m', memory: '512Mi'}
            limits: {cpu: '2', memory: '768Mi'}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ['ALL']}
---
apiVersion: v1
kind: Service
metadata:
  name: aurora-exchange
  namespace: aurora
spec:
  selector: {app: aurora-exchange}
  ports: [{port: 8080, targetPort: 8080}]
